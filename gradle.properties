#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072m -XX:+UseParallelGC
kotlin.mpp.commonizerJvmArgs=-Xmx2048m -XX:+UseParallelGC
kotlin.incremental.wasm=false

#Gradle
org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.kotlin.dsl.allWarningsAsErrors=true
org.gradle.daemon.performance.disable-logging=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.sync.suppressAgpWarnings=GENERIC,UNSUPPORTED_PROJECT_OPTION_USE

#Compose KMP
compose.resources.always.generate.accessors=true
org.jetbrains.compose.library.compatibility.check.disable=true
