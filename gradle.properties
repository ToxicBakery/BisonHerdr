#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072m -XX:+UseParallelGC
kotlin.mpp.commonizerJvmArgs=-Xmx2048m -XX:+UseParallelGC
kotlin.incremental.wasm=false

#Gradle
org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.kotlin.dsl.allWarningsAsErrors=true
org.gradle.daemon.performance.disable-logging=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.sync.suppressAgpWarnings=GENERIC,UNSUPPORTED_PROJECT_OPTION_USE

#Compose KMP
compose.resources.always.generate.accessors=true
org.jetbrains.compose.library.compatibility.check.disable=true
# The app has no desktop target, so it does not use Compose Hot Reload. The Compose plugin
# applies the hot reload plugin to a module with the Kotlin JVM plugin. It also applies it to
# a Kotlin Multiplatform module with a jvm() target. Version 1.2.0 of the hot reload plugin
# calls Gradle APIs that are deprecated. This property tells the Compose plugin not to apply it.
org.jetbrains.compose.hot.reload.disable=true
