[workspace]
resolver = "2"
members = [
    "herdr-protocol",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/herdrdev/herdr"
publish = false

[workspace.dependencies]
base64 = "0.22.1"
bincode = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1.44"
