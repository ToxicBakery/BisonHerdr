[workspace]
resolver = "2"
members = [
    "ghostty-vt",
    "herdr-protocol",
    "herdr-mobile-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/herdrdev/herdr"
publish = false

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22.1"
bincode = { version = "2", features = ["serde"] }
libc = "0.2"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1.44"
jni = "0.21"
aes = "0.8"
flate2 = "1.0"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
russh = "0.49"
ssh-key = "0.6"
ghostty-vt = { path = "ghostty-vt" }
herdr-protocol = { path = "herdr-protocol" }
